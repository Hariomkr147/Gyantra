services:
  - type: web
    name: gyantra-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: DOCLING_ENABLED
        value: "false"
      - key: OCR_ENABLED
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.2"
